name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Tests (offline models)
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: uv run pytest -v
      - name: Offline BM25 benchmark
        run: make eval-bm25
      - name: Preserve evaluation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bm25-evaluation
          path: artifacts/eval/
          if-no-files-found: error
